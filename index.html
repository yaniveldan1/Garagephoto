<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">

<style>
  :root{
    --bg:#0b1220;
    --panel:rgba(255,255,255,0.06);
    --panel-border:rgba(255,255,255,0.12);
    --accent:#3aa0ff;
    --accent2:#22d3a8;
    --text:#e8edf6;
    --text-dim:#93a0b8;
    --danger:#ff5c72;
    --warn:#ffb020;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Rubik',sans-serif;
    background:radial-gradient(1200px 800px at 80% -10%, #16233f 0%, var(--bg) 60%);
    color:var(--text);
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  .app{max-width:640px;margin:0 auto;padding:16px 16px 96px;}
  header.top{
    position:sticky;top:0;z-index:10;
    backdrop-filter:blur(10px);
    background:rgba(11,18,32,0.85);
    padding:14px 16px;margin:-16px -16px 16px;
    border-bottom:1px solid var(--panel-border);
    display:flex;align-items:center;justify-content:space-between;
  }
  header.top h1{font-size:17px;margin:0;font-weight:600;}
  .icon-btn{
    background:var(--panel);border:1px solid var(--panel-border);
    color:var(--text);border-radius:12px;padding:8px 10px;font-size:14px;
    display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
    backdrop-filter:blur(8px);
  }
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;}
  input[type=text], input[type=search], textarea, select{

  }
  textarea{min-height:80px;resize:vertical;}
  input::placeholder, textarea::placeholder{color:var(--text-dim);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 18px;border-radius:14px;border:none;font-size:15px;font-weight:600;
    cursor:pointer;width:100%;

  .btn-primary{background:linear-gradient(135deg,var(--accent),#2e6bff);color:#06111f;}

  .row{display:flex;gap:10px;}

    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);

  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;}

    position:absolute;top:4px;left:4px;background:rgba(0,0,0,0.6);color:#fff;

  .info-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--panel-border);font-size:14px;}
  .info-line:last-child{border-bottom:none;}

  .toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);

  .stat-num{font-size:22px;font-weight:700;line-height:1.1;}

  /* ---- Colored backup-status badges ---- */
  .status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;}
  .status-pending{background:rgba(255,176,32,0.18);color:var(--warn);}

  .status-failed{background:rgba(255,92,114,0.18);color:var(--danger);}

  /* ---- Case card v2 ---- */

  .case-item .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .case-item .plate{font-size:20px;letter-spacing:0.3px;}

  /* ---- Quick filter chips ---- */
  .chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;}
  .chip{flex:0 0 auto;padding:8px 16px;border-radius:999px;border:1px solid var(--panel-border);background:var(--panel);color:var(--text-dim);font-size:13px;cursor:pointer;font-family:inherit;}
  .chip.active{background:linear-gradient(135deg,var(--accent),#2e6bff);color:#06111f;border-color:transparent;font-weight:600;}

  /* ---- Detail hero ---- */
  .hero-plate{text-align:center;padding:6px 0 2px;}
  .hero-plate .plate-big{font-size:30px;font-weight:700;letter-spacing:1px;direction:ltr;}
  .hero-plate .plate-sub{color:var(--text-dim);font-size:14px;margin-top:4px;}

  /* ---- History timeline ---- */
  .history-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--panel-border);font-size:13.5px;}
  .history-item:last-child{border-bottom:none;}
  .history-item .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:5px;flex:none;}
  .history-item .txt{flex:1;}
  .history-item .time{color:var(--text-dim);font-size:11.5px;margin-top:2px;}

  /* ---- Draft / connection banners ---- */
  .banner{border-radius:14px;padding:13px 14px;margin-bottom:14px;font-size:13.5px;border:1px solid;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .banner-draft{background:rgba(58,160,255,0.1);border-color:rgba(58,160,255,0.35);}
  .banner-offline{background:rgba(255,176,32,0.1);border-color:rgba(255,176,32,0.35);color:var(--warn);}
  .banner p{margin:0;flex:1 1 200px;}
  #connBanner{position:sticky;top:0;z-index:9;}

  /* ---- Camera: focus ring + zoom slider ---- */
  .focus-ring{
    position:absolute;width:72px;height:72px;border-radius:50%;
    border:2px solid #fff;pointer-events:none;transform:translate(-50%,-50%) scale(1.15);

  .zoom-tag{color:#fff;font-size:12px;min-width:34px;text-align:center;}
  #torchBtn.active{background:var(--warn);color:#1a1200;}

  .vid-badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,0.6);}

<body>
<div id="connBanner" class="banner banner-offline hidden" style="border-radius:0;margin:0;justify-content:center;">📴 מצב לא מקוון — הנתונים נשמרים מקומית ויועלו אוטומטית כשהחיבור יחזור</div>
<div class="app" id="app"></div>
<div id="toastHost"></div>

<div id="cameraOverlay" style="position:fixed;inset:0;background:#000;z-index:200;display:none;flex-direction:column;">
  <div id="cameraPreviewWrap" style="position:relative;flex:1;overflow:hidden;">
    <video id="cameraVideo" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;background:#000;"></video>
    <div id="focusRing" class="focus-ring hidden"></div>
  </div>
  <div id="cameraToolsRow" style="display:flex;justify-content:center;gap:10px;padding:8px 0;background:rgba(0,0,0,0.55);">
    <button id="torchBtn" class="btn btn-secondary btn-sm hidden" onclick="toggleTorch()">🔦 פלאש</button>
    <button id="modeBtn" class="btn btn-secondary btn-sm" onclick="toggleCameraMode()">🎥 מעבר לוידאו</button>
  </div>
  <div id="zoomRow" class="zoom-row hidden">
    <span class="zoom-tag">1x</span>
    <input type="range" id="zoomSlider" min="1" max="3" step="0.1" value="1">
    <span class="zoom-tag" id="zoomLabel">1.0x</span>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 20px calc(18px + env(safe-area-inset-bottom));background:rgba(0,0,0,0.7);">
    <button class="btn btn-secondary btn-sm" onclick="closeCamera()">✕ סיום (<span id="camCount">0</span>)</button>
    <button id="captureBtn" onclick="onCaptureTap()" style="width:68px;height:68px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,0.4);"></button>
    <span style="width:80px"></span>
  </div>
</div>
<script>
/* ====================== IndexedDB layer ====================== */
// גרסת האפליקציה — לעדכן ידנית בכל שינוי מהותי, כדי לדעת בקלות אם המכשיר מריץ את הגרסה העדכנית.
const APP_VERSION = '1.2';

const DB_NAME = 'garagedocs';
const DB_VERSION = 2; // v2: added 'drafts' store for auto-saved in-progress cases (existing stores untouched)
let dbPromise = new Promise((resolve, reject) => {
  const req = indexedDB.open(DB_NAME, DB_VERSION);
  req.onupgradeneeded = (e) => {
    const db = e.target.result;
    if (!db.objectStoreNames.contains('cases')) {
      db.createObjectStore('cases', { keyPath: 'caseId' });
    }
    if (!db.objectStoreNames.contains('garages')) {
      db.createObjectStore('garages', { keyPath: 'garageId' });
    }
    if (!db.objectStoreNames.contains('photos')) {
      const s = db.createObjectStore('photos', { keyPath: 'photoId' });
      s.createIndex('caseId', 'caseId');
    }
    if (!db.objectStoreNames.contains('quotes')) {
      const s = db.createObjectStore('quotes', { keyPath: 'quoteId' });
      s.createIndex('caseId', 'caseId');
    }
    if (!db.objectStoreNames.contains('drafts')) {
      db.createObjectStore('drafts', { keyPath: 'id' });
    }
  };
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error);
});

async function tx(storeName, mode) {
  const db = await dbPromise;
  return db.transaction(storeName, mode).objectStore(storeName);
}
function reqToPromise(req) {
  return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });
}
async function dbGetAll(store) { return reqToPromise((await tx(store, 'readonly')).getAll()); }
async function dbGet(store, key) { return reqToPromise((await tx(store, 'readonly')).get(key)); }
async function dbPut(store, val) { return reqToPromise((await tx(store, 'readwrite')).put(val)); }
async function dbDelete(store, key) { return reqToPromise((await tx(store, 'readwrite')).delete(key)); }
async function dbGetByIndex(store, indexName, value) {
  const s = await tx(store, 'readonly');
  return reqToPromise(s.index(indexName).getAll(value));
}

function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

/* seed a couple of default garages on first run */
(async () => {
  const existing = await dbGetAll('garages');
  if (existing.length === 0) {
    for (const name of ['מוסך א׳', 'מוסך ב׳']) {
      await dbPut('garages', { garageId: uuid(), name, isActive: true });
    }
    render();
  }
})();

/* ====================== Plate normalization ====================== */
function normalizePlate(raw) { return (raw || '').replace(/\D/g, ''); }
function isValidPlate(n) { return n.length >= 7 && n.length <= 8; }
function formatPlate(n) {
  if (n.length === 8) return `${n.slice(0,3)}-${n.slice(3,5)}-${n.slice(5,8)}`;
  if (n.length === 7) return `${n.slice(0,2)}-${n.slice(2,5)}-${n.slice(5,7)}`;
  return n;
}

/* ====================== data.gov.il lookup ======================
   שים לב: שמות השדות למטה הם מועמדים סבירים (מבוססי תיעוד ציבורי של
   המאגר), לא מאומתים ישירות מול ה-API. הקוד לא נשען על שם שדה יחיד
   לחיפוש — הוא שולח q=<מספר רכב> (חיפוש טקסט חופשי) ואז מוודא התאמה
   מדויקת מקומית, וכל שדה שלא זוהה מוצג כ"נתון נוסף" במקום להיעלם.
   אם דפדפן חוסם את הבקשה (CORS) — המשתמש עדיין יכול להמשיך ידנית.
*/
const RESOURCE_ID = '053cea08-09bc-40ec-8f7a-156f0677aff3';
const FIELD_CANDIDATES = {
  plate: ['mispar_rechev','license_number','plate_number','mispar_rishuy'],
  manufacturer: ['tozeret_nm','tozeret_cd','manufacturer'],
  model: ['kinuy_mishari','degem_nm','model'],
  year: ['shnat_yitzur','production_year'],
  color: ['tzeva_rechev','color'],
  fuel: ['sug_delek_nm','fuel_type'],
};
const ALL_CANDIDATES = Object.values(FIELD_CANDIDATES).flat();

async function lookupVehicle(normalizedPlate) {
  const url = `https://data.gov.il/api/3/action/datastore_search?resource_id=${RESOURCE_ID}&q=${normalizedPlate}&limit=5`;
  try {
    const res = await fetch(url);
    if (!res.ok) return { status: 'error', message: `HTTP ${res.status}` };
    const data = await res.json();
    if (!data.success) return { status: 'error', message: 'success=false מה-API' };
    const records = (data.result && data.result.records) || [];
    const match = records.find(r =>
      FIELD_CANDIDATES.plate.some(k => String(r[k] ?? '').trim() === normalizedPlate) ||
      Object.values(r).some(v => String(v ?? '').trim() === normalizedPlate)
    );
    if (!match) return { status: 'not_found' };

    const firstMatch = (keys) => {
      for (const k of keys) { if (match[k] != null && String(match[k]).trim() !== '') return String(match[k]); }
      return null;
    };
    const extra = {};
    for (const [k, v] of Object.entries(match)) {
      if (!ALL_CANDIDATES.includes(k) && v != null && String(v).trim() !== '') extra[k] = String(v);
    }
    return {
      status: 'found',
      info: {
        manufacturer: firstMatch(FIELD_CANDIDATES.manufacturer),
        model: firstMatch(FIELD_CANDIDATES.model),
        year: firstMatch(FIELD_CANDIDATES.year),
        color: firstMatch(FIELD_CANDIDATES.color),
        fuel: firstMatch(FIELD_CANDIDATES.fuel),
        extra,
        raw: match,
      }
    };
  } catch (e) {
    return { status: 'error', message: e.message };
  }
}

/* ====================== Google Drive integration ======================
   OAuth (Google Identity Services, token client — לא צריך שרת backend).
   ההרשאה מוגבלת ל-drive.file: האפליקציה יכולה לגשת רק לקבצים/תיקיות
   שהיא עצמה יצרה, לא לכל ה-Drive של המשתמש.
*/
const GOOGLE_CLIENT_ID = '172861794382-6sg241brc1bck0so2lv2e1vau4pk4jnt.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';

let __tokenClient = null;
let __accessToken = null;
let __tokenExpiresAt = 0;

function getAccessToken() {
  return new Promise((resolve, reject) => {
    if (__accessToken && Date.now() < __tokenExpiresAt - 30000) {
      resolve(__accessToken);
      return;
    }
    if (!window.google || !google.accounts || !google.accounts.oauth2) {
      reject(new Error('שירות ההתחברות של Google עוד לא נטען, נסה שוב בעוד רגע'));
      return;
    }
    if (!__tokenClient) {
      __tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: DRIVE_SCOPE,
        callback: () => {}, // מוחלף בכל קריאה
      });
    }
    __tokenClient.callback = (resp) => {
      if (resp.error) { reject(new Error(resp.error)); return; }
      __accessToken = resp.access_token;
      __tokenExpiresAt = Date.now() + (resp.expires_in * 1000);
      resolve(__accessToken);
    };
    __tokenClient.requestAccessToken({ prompt: '' });
  });
}

async function driveFetch(url, options = {}) {
  const token = await getAccessToken();
  const res = await fetch(url, {
    ...options,
    headers: { ...(options.headers || {}), Authorization: `Bearer ${token}` }
  });
  if (!res.ok) {
    const text = await res.text().catch(() => '');
    throw new Error(`Drive API ${res.status}: ${text.slice(0, 200)}`);
  }
  return res.json();
}

async function driveDeleteFile(fileId) {
  const token = await getAccessToken();
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, {
    method: 'DELETE',
    headers: { Authorization: `Bearer ${token}` },
  });
  if (!res.ok && res.status !== 404) {
    const text = await res.text().catch(() => '');
    throw new Error(`Drive delete ${res.status}: ${text.slice(0, 200)}`);
  }
}

async function driveFindOrCreateFolder(name, parentId) {
  const safeName = name.replace(/'/g, "\\'");
  const parentClause = parentId ? ` and '${parentId}' in parents` : " and 'root' in parents";
  const q = `mimeType='application/vnd.google-apps.folder' and name='${safeName}' and trashed=false${parentClause}`;
  const listUrl = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)`;
  const existing = await driveFetch(listUrl);
  if (existing.files && existing.files.length > 0) return existing.files[0].id;

  const metadata = {
    name,
    mimeType: 'application/vnd.google-apps.folder',
    parents: parentId ? [parentId] : undefined,
  };
  const created = await driveFetch('https://www.googleapis.com/drive/v3/files?fields=id', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(metadata),
  });
  return created.id;
}

/**
 * בונה/מוודא את מבנה תיקי רכבים/<מספר רכב>/<תאריך_מוסך>[_שעה] ומחזיר
 * את מזהה וקישור התיקייה של האירוע הספציפי. אם אותו רכב פותח כמה תיקים
 * (אפילו באותו יום), כל תיק מקבל תיקייה נפרדת כי השם כולל גם שעה.
 */
async function driveEnsureCaseFolder(plateNormalized, garageName, createdAtEpochMillis) {
  const rootId = await driveFindOrCreateFolder('תיקי רכבים', null);
  const plateFolderId = await driveFindOrCreateFolder(plateNormalized, rootId);

  const d = new Date(createdAtEpochMillis);
  const pad = (n) => String(n).padStart(2, '0');
  const dateStr = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}`;
  const eventFolderName = `${dateStr}_${garageName}`;
  const eventFolderId = await driveFindOrCreateFolder(eventFolderName, plateFolderId);

  return { folderId: eventFolderId, folderUrl: `https://drive.google.com/drive/folders/${eventFolderId}` };
}

async function driveUploadFile(folderId, blob, filename, mimeType) {
  const token = await getAccessToken();
  const metadata = { name: filename, parents: [folderId] };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
  form.append('file', blob, filename);

  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST',
    headers: { Authorization: `Bearer ${token}` },
    body: form,
  });
  if (!res.ok) {
    const text = await res.text().catch(() => '');
    throw new Error(`Drive upload ${res.status}: ${text.slice(0, 200)}`);
  }
  const data = await res.json();
  return data.id;
}

/**
 * מעלה תיק שלם ל-Drive: יוצר/מוצא את תיקיית האירוע, מעלה כל תמונה
 * שעוד לא הועלתה + הצעת מחיר, ורק אז מוחק את הקבצים המקומיים
 * ומעדכן את סטטוס ההעלאה. לא מסמן "הועלה" אם קובץ כלשהו נכשל.
 */
async function syncCaseToDrive(caseId) {
  const c = await dbGet('cases', caseId);
  if (!c) return;
  await dbPut('cases', { ...c, uploadStatus: 'uploading' });
  renderInPlace();

  try {
    let folderId = c.driveFolderId;
    let folderUrl = c.driveFolderUrl;
    if (!folderId) {
      const folder = await driveEnsureCaseFolder(c.plateNormalized, c.garageName, c.createdAt);
      folderId = folder.folderId;
      folderUrl = folder.folderUrl;
    }

    const photos = await dbGetByIndex('photos', 'caseId', caseId);
    let allOk = true;
    for (const p of photos) {
      if (p.uploaded) continue;
      try {
        const fileId = await driveUploadFile(folderId, p.blob, `${p.photoId}.${fileExtFor(p.blob)}`, p.blob.type || 'image/jpeg');
        await dbPut('photos', { ...p, uploaded: true, driveFileId: fileId });
      } catch (e) { allOk = false; }
    }

    const quotes = await dbGetByIndex('quotes', 'caseId', caseId);
    for (const q of quotes) {
      if (q.uploaded) continue;
      try {
        const fileId = await driveUploadFile(folderId, q.blob, q.name, q.mime || q.blob.type || 'application/octet-stream');
        await dbPut('quotes', { ...q, uploaded: true, driveFileId: fileId });
      } catch (e) { allOk = false; }
    }

    const finalCase = await dbGet('cases', caseId);
    await dbPut('cases', { ...finalCase, driveFolderId: folderId, driveFolderUrl: folderUrl, uploadStatus: allOk ? 'uploaded' : 'failed' });

    // אחרי הצלחה מוחקים רק את קובץ המקור מהמכשיר (לא צריך להחזיק אותו פעמיים) —
    // אבל משאירים את הרשומה עצמה (בלי ה-blob) כדי שאפשר יהיה עדיין לראות
    // ולמחוק את הפריט מתוך האפליקציה גם אחרי שהוא כבר בענן.
    if (allOk) {
      const freshPhotos = await dbGetByIndex('photos', 'caseId', caseId);
      for (const p of freshPhotos) { const { blob, ...rest } = p; await dbPut('photos', rest); }
      const freshQuotes = await dbGetByIndex('quotes', 'caseId', caseId);
      for (const q of freshQuotes) { const { blob, ...rest } = q; await dbPut('quotes', rest); }
      toast('הועלה בהצלחה לגוגל דרייב');
      await addHistoryEntry(caseId, 'התבצע גיבוי ל-Google Drive');
    } else {
      toast('חלק מהקבצים לא עלו — אפשר לנסות שוב');
      await addHistoryEntry(caseId, 'הגיבוי נכשל (חלק מהקבצים)');
    }
  } catch (e) {
    const c2 = await dbGet('cases', caseId);
    await dbPut('cases', { ...c2, uploadStatus: 'failed' });
    toast('העלאה ל-Drive נכשלה: ' + e.message);
    await addHistoryEntry(caseId, 'הגיבוי נכשל: ' + e.message);
  }
  renderInPlace();
}
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toastHost').appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

/* ====================== Activity history ======================
   כל תיק שומר מערך history עם אירועים אמיתיים בלבד (לא מדומים).
   שדה אופציונלי — תיקים ישנים בלי history פשוט יוצגו עם רשימה ריקה.
*/
async function addHistoryEntry(caseId, text) {
  const c = await dbGet('cases', caseId);
  if (!c) return;
  const history = Array.isArray(c.history) ? c.history.slice() : [];
  history.push({ ts: Date.now(), text });
  await dbPut('cases', { ...c, history });
}

/* ====================== Colored backup-status badge ====================== */
function statusPill(status) {
  switch (status) {
    case 'uploaded': return `<span class="status-pill status-uploaded">🟢 גובה ל-Drive</span>`;
    case 'uploading': return `<span class="status-pill status-uploading">🔵 מתבצע גיבוי</span>`;
    case 'failed': return `<span class="status-pill status-failed">🔴 שגיאה בגיבוי</span>`;
    default: return `<span class="status-pill status-pending">🟠 ממתין לגיבוי</span>`;
  }
}

/* ====================== Date quick-filter ====================== */
function matchesDateFilter(createdAt, filter) {
  if (!filter || filter === 'all') return true;
  const now = new Date();
  const d = new Date(createdAt);
  if (filter === 'today') {
    return d.toDateString() === now.toDateString();
  }
  if (filter === 'week') {
    const weekAgo = new Date(now); weekAgo.setDate(now.getDate() - 7);
    return d >= weekAgo;
  }
  if (filter === 'month') {
    const monthAgo = new Date(now); monthAgo.setMonth(now.getMonth() - 1);
    return d >= monthAgo;
  }
  return true;
}

/* ====================== Draft autosave ======================
   נשמר ב-IndexedDB (store נפרד 'drafts', לא נוגע ב-store של cases) כדי
   שגם תמונות/הצעת מחיר (Blob) ישרדו סגירה של האפליקציה. נשמר תחת מפתח
   קבוע 'current' — יש לכל היותר טיוטה פתוחה אחת בכל רגע נתון.
*/
let __draftSaveTimer = null;
function scheduleAutosaveDraft() {
  clearTimeout(__draftSaveTimer);
  __draftSaveTimer = setTimeout(autosaveDraftNow, 400);
}
async function autosaveDraftNow() {
  if (!__newCaseDraft) return;
  const d = __newCaseDraft;
  const hasContent = d.plateInput || d.garageId || d.notes || d.photos.length || d.quote || d.lookup;
  if (!hasContent) return;
  try {
    await dbPut('drafts', {
      id: 'current',
      plateInput: d.plateInput,
      lookup: d.lookup,
      garageId: d.garageId,
      notes: d.notes,
      manual: d.manual,
      photos: d.photos.map(p => ({ blob: p.file })),
      quote: d.quote ? { blob: d.quote.file, name: d.quote.name, mime: d.quote.mime } : null,
      updatedAt: Date.now(),
    });
  } catch (e) { /* שמירת טיוטה היא best-effort — לא חוסמת את העבודה השוטפת */ }
}
async function checkForDraft() {
  try { return await dbGet('drafts', 'current'); } catch (e) { return null; }
}
async function resumeDraft() {
  const saved = await checkForDraft();
  if (!saved) return;
  __newCaseDraft = {
    plateInput: saved.plateInput || '',
    lookup: saved.lookup || null,
    lookupLoading: false,
    garageId: saved.garageId || '',
    photos: (saved.photos || []).map(p => ({ file: p.blob, url: URL.createObjectURL(p.blob) })),
    quote: saved.quote ? { file: saved.quote.blob, name: saved.quote.name, mime: saved.quote.mime } : null,
    notes: saved.notes || '',
    manual: saved.manual || { manufacturer:'', model:'', year:'', color:'', fuel:'' },
  };
  nav('new');
}
async function discardDraft() {
  try {
    const existing = await dbGet('drafts', 'current');
    if (existing) await dbDelete('drafts', 'current');
  } catch (e) {}
  toast('הטיוטה נמחקה');
  renderInPlace();
}
async function clearDraftSilently() {
  try {
    const existing = await dbGet('drafts', 'current');
    if (existing) await dbDelete('drafts', 'current');
  } catch (e) {}
}

/* ====================== Online / Offline ======================
   לא גורם ל-render() מלא (כדי לא לאבד פוקוס בשדה טקסט) — מעדכן ישירות
   את הבאנר, ובחזרה לרשת מנסה להעלות תיקים שממתינים/נכשלו.
*/
function updateConnectionBanner() {
  const el = document.getElementById('connBanner');
  if (!el) return;
  el.classList.toggle('hidden', navigator.onLine);
}
let __autoSyncing = false;
async function autoSyncPendingCases() {
  if (__autoSyncing) return;
  __autoSyncing = true;
  try {
    const cases = await dbGetAll('cases');
    const pending = cases.filter(c => c.uploadStatus === 'pending' || c.uploadStatus === 'failed');
    for (const c of pending) {
      if (!navigator.onLine) break;
      await syncCaseToDrive(c.caseId);
    }
  } finally {
    __autoSyncing = false;
  }
}
window.addEventListener('online', () => { updateConnectionBanner(); toast('החיבור חזר — מנסה להעלות תיקים ממתינים'); autoSyncPendingCases(); });
window.addEventListener('offline', updateConnectionBanner);

  if (n) n.oninput = (e) => { __newCaseDraft.notes = e.target.value; scheduleAutosaveDraft(); };

  const manualFields = [
    ['manManufacturer','manufacturer'], ['manModel','model'], ['manYear','year'],
    ['manColor','color'], ['manFuel','fuel']
  ];
  for (const [id, key] of manualFields) {
    const el = document.getElementById(id);
    if (el) el.oninput = (e) => { __newCaseDraft.manual[key] = e.target.value; scheduleAutosaveDraft(); };
  }
}

async function doLookup() {
  const normalized = normalizePlate(__newCaseDraft.plateInput);
  if (!isValidPlate(normalized)) { toast('מספר רכב לא תקין (7-8 ספרות)'); return; }
  __newCaseDraft.lookupLoading = true;
  renderInPlace();
  const result = await lookupVehicle(normalized);
  __newCaseDraft.lookup = result;
  __newCaseDraft.lookupLoading = false;
  renderInPlace();
  scheduleAutosaveDraft();
}

function toggleRawJson() {
  __newCaseDraft.showRaw = !__newCaseDraft.showRaw;
  renderInPlace();
}

function onPhotoTaken(e) {
  // מבחר מהגלריה (אפשר לבחור כמה תמונות בבת אחת)
  const files = Array.from(e.target.files || []);
  for (const file of files) {
    __newCaseDraft.photos.push({ file, url: URL.createObjectURL(file) });
  }
  e.target.value = '';
  renderInPlace();
  scheduleAutosaveDraft();
}
function removePhoto(i) { __newCaseDraft.photos.splice(i,1); renderInPlace(); scheduleAutosaveDraft(); }

/* ====================== Live in-page camera ======================
   מצלמה חיה בתוך הדף (getUserMedia) — כדי לצלם ברצף מהיר בלי לצאת
   מהדף ובלי מסך אישור בין תמונה לתמונה.

   האיכות: כל צילום משתמש ב-ImageCapture.takePhoto() — זו קריאה
   שמפעילה את "צנרת הצילום הסטילס" האמיתית של החומרה (אותה צנרת
   שאפליקציית המצלמה של המכשיר משתמשת בה: פוקוס-חד-פעמי אמיתי,
   הרזולוציה המלאה של החיישן), לא רק "צילום מסך" של פריים מהוידאו
   החי. בדפדפנים/מכשירים שלא תומכים ב-API הזה, נופלים בעדינות לצילום
   פריים מהוידאו (השיטה הישנה) כדי שזה תמיד יעבוד.

   זום ופוקוס-במגע נשארים כפי שהיו — הרחבות לא-סטנדרטיות של כרום
   לאנדרואיד, תמיד עם בדיקת תמיכה ונפילה עדינה כשאין תמיכה.
*/
let __cameraStream = null;
let __videoTrack = null;
let __imageCapture = null;
let __cameraTargetCaseId = null;   // null = מוסיפים לטיוטת תיק חדש; אחרת = מוסיפים ישירות לתיק קיים
let __cameraSessionCount = 0;      // כמה תמונות/סרטונים צולמו בסבב הנוכחי (לשימוש כשמוסיפים לתיק קיים)
let __zoomInfo = { supported: false, hardware: false, min: 1, max: 3, step: 0.1 };
let __digitalZoom = 1;
let __pinchStartDist = null;
let __pinchStartZoom = 1;
let __torchSupported = false;
let __torchOn = false;
let __cameraMode = 'photo'; // 'photo' | 'video'
let __mediaRecorder = null;
let __recordedChunks = [];
let __isRecording = false;

async function openCamera(targetCaseId) {
  __cameraTargetCaseId = targetCaseId || null;
  __cameraSessionCount = 0;
  __cameraMode = 'photo';
  __isRecording = false;
  const videoConstraints = {
    facingMode: { ideal: 'environment' },
    width: { ideal: 1920 },
    height: { ideal: 1080 }
  };
  try {
    // מבקשים גם מיקרופון כדי שסרטונים (למשל רעש ממנוע) יצאו עם קול.
    __cameraStream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: true });
  } catch (e1) {
    try {
      __cameraStream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: false });
      toast('אין הרשאת מיקרופון — סרטונים יוקלטו בלי קול.');
    } catch (e2) {
      toast('לא ניתן לגשת למצלמה (' + e2.message + '). אפשר לבחור תמונות דרך "העלאה".');
      return;
    }
  }
  const video = document.getElementById('cameraVideo');
  video.srcObject = __cameraStream;
  video.style.transform = '';
  document.getElementById('cameraOverlay').style.display = 'flex';
  updateCamCount();

  __videoTrack = __cameraStream.getVideoTracks()[0] || null;
  __digitalZoom = 1;
  __zoomInfo = { supported: false, hardware: false, min: 1, max: 3, step: 0.1 };
  __imageCapture = null;
  __torchSupported = false;
  __torchOn = false;

  if (__videoTrack) {
    // ImageCapture — צילום סטילס אמיתי מהחומרה (העדיפות הראשונה)
    if (typeof ImageCapture !== 'undefined') {
      try { __imageCapture = new ImageCapture(__videoTrack); } catch (e) { __imageCapture = null; }
    }
    // פוקוס אוטומטי רציף + יכולות זום/פלאש, כשזמינות
    if (__videoTrack.getCapabilities) {
      try {
        const caps = __videoTrack.getCapabilities();
        if (caps.focusMode && caps.focusMode.includes('continuous')) {
          await __videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
        }
        if (caps.zoom && typeof caps.zoom.max === 'number') {
          __zoomInfo = { supported: true, hardware: true, min: caps.zoom.min ?? 1, max: caps.zoom.max, step: caps.zoom.step || 0.1 };
        } else {
          __zoomInfo = { supported: true, hardware: false, min: 1, max: 3, step: 0.1 };
        }
        if (caps.torch) __torchSupported = true;
      } catch (e) {
        __zoomInfo = { supported: true, hardware: false, min: 1, max: 3, step: 0.1 };
      }
    } else {
      __zoomInfo = { supported: true, hardware: false, min: 1, max: 3, step: 0.1 };
    }
  }
  setupZoomSlider();
  setupPinchAndTapToFocus();
  setupCameraToolsRow();
}

function setupCameraToolsRow() {
  const torchBtn = document.getElementById('torchBtn');
  if (torchBtn) { torchBtn.classList.toggle('hidden', !__torchSupported); torchBtn.classList.remove('active'); }
  const modeBtn = document.getElementById('modeBtn');
  if (modeBtn) modeBtn.textContent = '🎥 מעבר לוידאו';
  const captureBtn = document.getElementById('captureBtn');
  if (captureBtn) captureBtn.classList.remove('recording');
}

function toggleCameraMode() {
  if (__isRecording) return; // אי אפשר להחליף מצב באמצע הקלטה
  __cameraMode = __cameraMode === 'photo' ? 'video' : 'photo';
  const btn = document.getElementById('modeBtn');
  if (btn) btn.textContent = __cameraMode === 'photo' ? '🎥 מעבר לוידאו' : '📷 מעבר לתמונה';
}

async function toggleTorch() {
  if (!__videoTrack || !__torchSupported) return;
  const next = !__torchOn;
  try {
    await __videoTrack.applyConstraints({ advanced: [{ torch: next }] });
    __torchOn = next;
  } catch (e) { toast('לא ניתן להפעיל פלאש במכשיר הזה'); }
  const btn = document.getElementById('torchBtn');
  if (btn) btn.classList.toggle('active', __torchOn);
}

function onCaptureTap() {
  if (__cameraMode === 'video') { toggleRecording(); } else { capturePhoto(); }
}

function pickVideoMimeType() {
  const candidates = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'];
  for (const c of candidates) { if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c; }
  return '';
}

function toggleRecording() {
  if (__isRecording) { stopRecording(); } else { startRecording(); }
}

function startRecording() {
  if (!__cameraStream || !window.MediaRecorder) { toast('הקלטת וידאו לא נתמכת בדפדפן הזה'); return; }
  const mimeType = pickVideoMimeType();
  try {
    __mediaRecorder = mimeType ? new MediaRecorder(__cameraStream, { mimeType }) : new MediaRecorder(__cameraStream);
  } catch (e) { toast('לא ניתן להתחיל הקלטה: ' + e.message); return; }
  __recordedChunks = [];
  __mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) __recordedChunks.push(e.data); };
  __mediaRecorder.onstop = onRecordingStopped;
  __mediaRecorder.start();
  __isRecording = true;
  const captureBtn = document.getElementById('captureBtn');
  if (captureBtn) captureBtn.classList.add('recording');
}

function stopRecording() {
  if (__mediaRecorder && __mediaRecorder.state !== 'inactive') { __mediaRecorder.stop(); }
  __isRecording = false;
  const captureBtn = document.getElementById('captureBtn');
  if (captureBtn) captureBtn.classList.remove('recording');
}

async function onRecordingStopped() {
  const blob = new Blob(__recordedChunks, { type: (__mediaRecorder && __mediaRecorder.mimeType) || 'video/webm' });
  __recordedChunks = [];
  if (!blob.size) return;
  if (__cameraTargetCaseId) {
    await dbPut('photos', { photoId: uuid(), caseId: __cameraTargetCaseId, blob, type: blob.type || 'image/jpeg' });
    __cameraSessionCount++;
  } else {
    __newCaseDraft.photos.push({ file: blob, url: URL.createObjectURL(blob) });
    scheduleAutosaveDraft();
  }
  updateCamCount();
  toast('הווידאו נשמר');
}

function setupZoomSlider() {
  const row = document.getElementById('zoomRow');
  const slider = document.getElementById('zoomSlider');
  if (!row || !slider) return;
  row.classList.remove('hidden');
  slider.min = __zoomInfo.min;
  slider.max = __zoomInfo.max;
  slider.step = __zoomInfo.step;
  slider.value = __zoomInfo.min;
  updateZoomLabel(__zoomInfo.min);
  slider.oninput = (e) => applyZoom(parseFloat(e.target.value));
}

function updateZoomLabel(value) {
  const label = document.getElementById('zoomLabel');
  if (label) label.textContent = value.toFixed(1) + 'x';
}

async function applyZoom(value) {
  const clamped = Math.min(__zoomInfo.max, Math.max(__zoomInfo.min, value));
  updateZoomLabel(clamped);
  const slider = document.getElementById('zoomSlider');
  if (slider && parseFloat(slider.value) !== clamped) slider.value = clamped;

  if (__zoomInfo.hardware && __videoTrack) {
    try { await __videoTrack.applyConstraints({ advanced: [{ zoom: clamped }] }); return; } catch (e) { /* נופל לזום דיגיטלי */ }
  }
  __digitalZoom = clamped;
  const video = document.getElementById('cameraVideo');
  if (video) video.style.transform = `scale(${clamped})`;
}

function setupPinchAndTapToFocus() {
  const wrap = document.getElementById('cameraPreviewWrap');
  if (!wrap) return;
  wrap.ontouchstart = (e) => {
    if (e.touches.length === 2) {
      __pinchStartDist = touchDistance(e.touches);
      __pinchStartZoom = __zoomInfo.hardware ? parseFloat(document.getElementById('zoomSlider')?.value || __zoomInfo.min) : __digitalZoom;
    } else if (e.touches.length === 1) {
      showFocusRing(e.touches[0].clientX, e.touches[0].clientY);
      attemptFocusAt(e.touches[0], wrap);
    }
  };
  wrap.ontouchmove = (e) => {
    if (e.touches.length === 2 && __pinchStartDist) {
      e.preventDefault();
      const dist = touchDistance(e.touches);
      const ratio = dist / __pinchStartDist;
      applyZoom(__pinchStartZoom * ratio);
    }
  };
  wrap.ontouchend = () => { __pinchStartDist = null; };
}

function touchDistance(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

function showFocusRing(x, y) {
  const ring = document.getElementById('focusRing');
  const wrap = document.getElementById('cameraPreviewWrap');
  if (!ring || !wrap) return;
  const rect = wrap.getBoundingClientRect();
  ring.style.left = (x - rect.left) + 'px';
  ring.style.top = (y - rect.top) + 'px';
  ring.classList.remove('show');
  void ring.offsetWidth;
  ring.classList.add('show');
  clearTimeout(ring.__hideTimer);
  ring.__hideTimer = setTimeout(() => ring.classList.remove('show'), 700);
}

async function attemptFocusAt(touch, wrap) {
  if (!__videoTrack || !__videoTrack.getCapabilities) return;
  try {
    const caps = __videoTrack.getCapabilities();
    if (!caps.pointsOfInterest) return;
    const rect = wrap.getBoundingClientRect();
    const x = (touch.clientX - rect.left) / rect.width;
    const y = (touch.clientY - rect.top) / rect.height;
    const advanced = [{ pointsOfInterest: [{ x, y }] }];
    if (caps.focusMode && caps.focusMode.includes('single-shot')) advanced[0].focusMode = 'single-shot';
    await __videoTrack.applyConstraints({ advanced }).catch(() => {});
  } catch (e) { /* לא נתמך על המכשיר הזה */ }
}

function updateCamCount() {
  const el = document.getElementById('camCount');
  if (!el) return;
  el.textContent = __cameraTargetCaseId ? __cameraSessionCount : __newCaseDraft.photos.length;
}

async function capturePhoto() {
  const video = document.getElementById('cameraVideo');
  if (!video.videoWidth) return;

  let blob = null;
  if (__imageCapture) {
    try { blob = await __imageCapture.takePhoto(); } catch (e) { blob = null; } // נופל לצילום פריים מהוידאו
  }
  if (!blob) {
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    if (!__zoomInfo.hardware && __digitalZoom > 1) {
      const sw = video.videoWidth / __digitalZoom;
      const sh = video.videoHeight / __digitalZoom;
      const sx = (video.videoWidth - sw) / 2;
      const sy = (video.videoHeight - sh) / 2;
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    } else {
      ctx.drawImage(video, 0, 0);
    }
    blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.9));
  }
  if (!blob) return;

  if (__cameraTargetCaseId) {
    await dbPut('photos', { photoId: uuid(), caseId: __cameraTargetCaseId, blob, type: blob.type || 'image/jpeg' });
    __cameraSessionCount++;
  } else {
    __newCaseDraft.photos.push({ file: blob, url: URL.createObjectURL(blob) });
    scheduleAutosaveDraft();
  }
  updateCamCount();
  flashShutter();
}

function flashShutter() {
  const v = document.getElementById('cameraVideo');
  v.style.opacity = '0.4';
  setTimeout(() => { v.style.opacity = '1'; }, 90);
}

async function closeCamera() {
  if (__isRecording && __mediaRecorder && __mediaRecorder.state !== 'inactive') {
    // מוודאים שההקלטה מסתיימת ונשמרת (dbPut) *לפני* שעוצרים את הטראקים,
    // אחרת החלק האחרון של הסרטון עלול ללכת לאיבוד.
    await new Promise((resolve) => {
      const prevOnStop = __mediaRecorder.onstop;
      __mediaRecorder.onstop = async () => { await prevOnStop(); resolve(); };
      __mediaRecorder.stop();
    });
    __isRecording = false;
  }
  if (__cameraStream) { __cameraStream.getTracks().forEach(t => t.stop()); __cameraStream = null; }
  __videoTrack = null;
  __imageCapture = null;
  __pinchStartDist = null;
  document.getElementById('cameraOverlay').style.display = 'none';
  const row = document.getElementById('zoomRow');
  if (row) row.classList.add('hidden');

  if (__cameraTargetCaseId && __cameraSessionCount > 0) {
    await addHistoryEntry(__cameraTargetCaseId, `נוספו ${__cameraSessionCount} קבצי מדיה`);
    await reopenForSync(__cameraTargetCaseId);
  } else {
    renderInPlace();
  }
  __cameraTargetCaseId = null;
  __cameraSessionCount = 0;
}


function onQuoteChosen(e) {
  const file = e.target.files[0];
  if (!file) return;
  __newCaseDraft.quote = { file, name: file.name, mime: file.type };
  e.target.value = '';
  renderInPlace();
  scheduleAutosaveDraft();
}
function removeQuote() { __newCaseDraft.quote = null; renderInPlace(); scheduleAutosaveDraft(); }

function cancelNewCase() {

async function finishCase() {
  const d = __newCaseDraft;
  const normalized = normalizePlate(d.plateInput);
  if (!isValidPlate(normalized)) { toast('יש להזין מספר רכב תקין'); return; }
  if (!d.garageId) { toast('יש לבחור מוסך'); return; }

  const garages = await dbGetAll('garages');
  const garage = garages.find(g => g.garageId === d.garageId);
  const caseId = uuid();
  const createdAt = Date.now();

  const info = (d.lookup && d.lookup.status === 'found') ? d.lookup.info : null;
  const m = d.manual || {};

  await dbPut('cases', {
    caseId,
    plateNormalized: normalized,
    garageId: d.garageId,
    garageName: garage ? garage.name : '',
    manufacturer: info?.manufacturer || m.manufacturer || null,
    model: info?.model || m.model || null,
    year: info?.year || m.year || null,
    color: info?.color || m.color || null,
    fuel: info?.fuel || m.fuel || null,
    vehicleDataFound: !!info,
    vehicleDataRaw: info ? JSON.stringify(info.raw) : null,
    notes: d.notes || '',
    createdAt,
    status: 'completed',
    uploadStatus: 'pending',
  });

  for (const p of d.photos) {
    await dbPut('photos', { photoId: uuid(), caseId, blob: p.file, type: p.file.type || 'image/jpeg' });
  }
  if (d.quote) {
    await dbPut('quotes', { quoteId: uuid(), caseId, blob: d.quote.file, name: d.quote.name, mime: d.quote.mime });
  }

  await addHistoryEntry(caseId, 'התיק נפתח');
  if (d.photos.length) await addHistoryEntry(caseId, `נוספו ${d.photos.length} תמונות`);
  if (d.quote) await addHistoryEntry(caseId, 'נוספה הצעת מחיר');

  __newCaseDraft = null;
  await clearDraftSilently();
  toast('התיק נשמר, מעלה לגוגל דרייב...');
  nav('list');
  syncCaseToDrive(caseId); // לא ממתינים — עובד ברקע, גם אם אין אינטרנט כרגע זה פשוט ייכשל ואפשר לנסות שוב מהתיק
}

            return isVideo
              ? `<div class="thumb"><video data-photo-id="${p.photoId}" muted onclick="event.stopPropagation(); this.play()"></video><div class="vid-badge">▶️</div><button class="del" onclick="event.stopPropagation();deletePhotoFromCase('${caseId}','${p.photoId}')">✕</button></div>`
              : `<div class="thumb"><img data-photo-id="${p.photoId}"><button class="del" onclick="deletePhotoFromCase('${caseId}','${p.photoId}')">✕</button></div>`;
          }
          return `<div class="thumb" style="display:flex;align-items:center;justify-content:center;font-size:22px;">${isVideo ? '🎥☁️' : '☁️'}<button class="del" onclick="deletePhotoFromCase('${caseId}','${p.photoId}')">✕</button></div>`;
        }).join('')}
      </div>
      <input type="file" accept="image/*" multiple id="detailGalleryInput" class="hidden" onchange="onDetailPhotosAdded(event,'${caseId}')">
      <div class="row" style="margin-top:10px">
        <button class="btn btn-secondary" onclick="openCamera('${caseId}')">📷 הוסף מהמצלמה</button>
        <button class="btn btn-secondary" onclick="document.getElementById('detailGalleryInput').click()">📤 הוסף מהגלריה</button>
      </div>

      ${quotes.length > 0 ? quotes.map(q => `
        <div class="file-chip" style="margin-top:8px">
          <span>📄 ${escapeHtml(q.name)}</span>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-secondary btn-sm" onclick="openQuote('${q.quoteId}')">פתח</button>
            <button class="btn btn-danger btn-sm" onclick="deleteQuoteFromCase('${caseId}','${q.quoteId}')">מחק</button>
          </div>
        </div>
      `).join('') : ''}
      <input type="file" accept="application/pdf,image/jpeg,image/png" id="detailQuoteInput" class="hidden" onchange="onDetailQuoteAdded(event,'${caseId}')">
      <button class="btn btn-secondary btn-sm" style="margin-top:8px" onclick="document.getElementById('detailQuoteInput').click()">➕ הוסף הצעת מחיר</button>

      ${c.driveFolderUrl ? `<a href="${c.driveFolderUrl}" target="_blank" class="btn btn-secondary" style="margin-top:12px;text-decoration:none;">📁 פתח תיקייה בגוגל דרייב</a>` : ''}
      ${(c.uploadStatus === 'pending' || c.uploadStatus === 'failed') ? `<button class="btn btn-success" style="margin-top:12px" onclick="syncCaseToDrive('${caseId}')">☁️ ${c.uploadStatus==='failed' ? 'נסה שוב להעלות' : 'העלה עכשיו ל-Drive'}</button>` : ''}
      ${c.uploadStatus === 'uploading' ? `<div style="text-align:center;margin-top:10px;color:var(--text-dim);">מעלה ל-Drive...</div>` : ''}
    </div>

    ${(photos.some(p=>p.blob) || quotes.some(q=>q.blob)) ? `
      <div class="card">
        <label style="display:block;font-size:13px;color:var(--text-dim);margin-bottom:10px;">שיתוף (מהמכשיר בלבד)</label>
        <div class="row">
          ${photos.some(p=>p.blob) ? `<button class="btn btn-secondary" onclick="shareSelection('${caseId}', true, false)">📤 תמונות בלבד</button>` : ''}
          ${quotes.some(q=>q.blob) ? `<button class="btn btn-secondary" onclick="shareSelection('${caseId}', false, true)">📤 הצעת מחיר בלבד</button>` : ''}
        </div>
        ${(photos.some(p=>p.blob) && quotes.some(q=>q.blob)) ? `<button class="btn btn-secondary" style="margin-top:8px" onclick="shareSelection('${caseId}', true, true)">📤 הכל יחד</button>` : ''}
      </div>
    ` : ''}

    <div class="card">
      <label style="display:block;font-size:13px;color:var(--text-dim);margin-bottom:10px;">הערות</label>
      <textarea id="detailNotes">${escapeHtml(c.notes || '')}</textarea>
      <button class="btn btn-secondary" style="margin-top:10px" onclick="saveNotes('${caseId}')">שמור הערות</button>
    </div>

    <div class="card">
      <label style="display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;">היסטוריית פעולות</label>
      ${(c.history && c.history.length) ? c.history.slice().reverse().map(h => `
        <div class="history-item">
          <div class="dot"></div>
          <div class="txt">${escapeHtml(h.text)}<div class="time">${formatDate(h.ts)}</div></div>
        </div>
      `).join('') : `<div style="color:var(--text-dim);font-size:13px;">אין עדיין פעולות רשומות עבור תיק זה.</div>`}
    </div>

    <div class="card">
      <button class="btn btn-danger" onclick="deleteCase('${caseId}')">🗑 מחק תיק לצמיתות</button>
    </div>
  `;
}

function toggleEditVehicle(caseId) { window.__editingCaseId = caseId; renderInPlace(); }
function cancelEditVehicle() { window.__editingCaseId = null; renderInPlace(); }

async function saveVehicleEdit(caseId) {
  const c = await dbGet('cases', caseId);
  if (!c) return;
  const garages = await dbGetAll('garages');
  const garageId = document.getElementById('editGarage').value;
  const garage = garages.find(g => g.garageId === garageId);
  c.manufacturer = document.getElementById('editManufacturer').value.trim() || null;
  c.model = document.getElementById('editModel').value.trim() || null;
  c.year = document.getElementById('editYear').value.trim() || null;
  c.color = document.getElementById('editColor').value.trim() || null;
  c.fuel = document.getElementById('editFuel').value.trim() || null;
  c.garageId = garageId;
  c.garageName = garage ? garage.name : c.garageName;
  await dbPut('cases', c);
  await addHistoryEntry(caseId, 'פרטי הרכב עודכנו ידנית');
  window.__editingCaseId = null;
  toast('הפרטים עודכנו');
  renderInPlace();
}

/* הוספת תמונות/הצעת מחיר לתיק שכבר נשמר — אם התיק כבר הועלה ל-Drive,
   מסמנים אותו שוב כ'ממתין' כדי שהקבצים החדשים בלבד יעלו (syncCaseToDrive
   כבר מדלג על קבצים שסומנו uploaded, כך שזה בטוח להריץ שוב). */
async function onDetailPhotosAdded(e, caseId) {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  if (files.length === 0) return;
  for (const file of files) {
    await dbPut('photos', { photoId: uuid(), caseId, blob: file, type: file.type || 'image/jpeg' });
  }
  await addHistoryEntry(caseId, `נוספו ${files.length} תמונות`);
  await reopenForSync(caseId);
}

async function onDetailQuoteAdded(e, caseId) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  await dbPut('quotes', { quoteId: uuid(), caseId, blob: file, name: file.name, mime: file.type });
  await addHistoryEntry(caseId, 'נוספה הצעת מחיר');
  await reopenForSync(caseId);
}

async function reopenForSync(caseId) {
  const c = await dbGet('cases', caseId);
  if (c && c.uploadStatus !== 'uploading') {
    await dbPut('cases', { ...c, uploadStatus: 'pending' });
  }
  toast('נשמר, מעלה לגוגל דרייב...');
  renderInPlace();
  syncCaseToDrive(caseId);
}

async function afterDetailRender(caseId) {
  const photos = await dbGetByIndex('photos', 'caseId', caseId);
  for (const p of photos) {
    if (!p.blob) continue;
    const el = document.querySelector(`[data-photo-id="${p.photoId}"]`);
    if (el) el.src = URL.createObjectURL(p.blob);
  }
  const notesEl = document.getElementById('detailNotes');
  if (notesEl) {
    notesEl.oninput = () => { __dirtyNotesCaseId = caseId; scheduleAutosaveNotes(caseId); };
  }
}

async function deletePhotoFromCase(caseId, photoId) {
  const p = await dbGet('photos', photoId);
  if (!p) return;
  if (p.driveFileId) {
    try { await driveDeleteFile(p.driveFileId); }
    catch (e) { toast('מחיקה מ-Drive נכשלה: ' + e.message); return; }
  }
  await dbDelete('photos', photoId);
  toast('התמונה נמחקה');
  renderInPlace();
}

async function deleteQuoteFromCase(caseId, quoteId) {
  const q = await dbGet('quotes', quoteId);
  if (!q) return;
  if (q.driveFileId) {
    try { await driveDeleteFile(q.driveFileId); }
    catch (e) { toast('מחיקה מ-Drive נכשלה: ' + e.message); return; }
  }
  await dbDelete('quotes', quoteId);
  toast('הצעת המחיר נמחקה');
  renderInPlace();
}

async function deleteCase(caseId) {
  if (!confirm('למחוק את התיק לצמיתות? כולל כל התמונות וההצעה — מהמכשיר ומגוגל דרייב.')) return;
  const c = await dbGet('cases', caseId);
  if (c && c.driveFolderId) {
    try { await driveDeleteFile(c.driveFolderId); }
    catch (e) { toast('מחיקה מ-Drive נכשלה: ' + e.message + ' — התיק לא נמחק'); return; }
  }
  const photos = await dbGetByIndex('photos', 'caseId', caseId);
  for (const p of photos) await dbDelete('photos', p.photoId);
  const quotes = await dbGetByIndex('quotes', 'caseId', caseId);
  for (const q of quotes) await dbDelete('quotes', q.quoteId);
  await dbDelete('cases', caseId);
  toast('התיק נמחק');
  nav('list');
}

async function saveNotes(caseId) {
  const c = await dbGet('cases', caseId);
  c.notes = document.getElementById('detailNotes').value;
  await dbPut('cases', c);
  __dirtyNotesCaseId = null;
  toast('ההערות נשמרו');
}

/* ====================== Silent notes autosave ======================
   רשת ביטחון נוספת: אם המשתמש כתב הערה בתוך תיק קיים ויצא בלי ללחוץ
   "שמור הערות", הטקסט עדיין נשמר ברקע (בלי טוסט, כדי לא להציף).
   הכפתור הידני ממשיך לעבוד בדיוק כפי שהיה.
*/
let __dirtyNotesCaseId = null;
let __notesSaveTimer = null;
function scheduleAutosaveNotes(caseId) {
  clearTimeout(__notesSaveTimer);
  __notesSaveTimer = setTimeout(() => autosaveNotesNow(caseId), 500);
}
async function autosaveNotesNow(caseId) {
  const el = document.getElementById('detailNotes');
  if (!el) return;
  const c = await dbGet('cases', caseId);
  if (!c || c.notes === el.value) return;
  await dbPut('cases', { ...c, notes: el.value });
  __dirtyNotesCaseId = null;
}

/* ====================== Flush on sudden exit ======================
   'visibilitychange' (hidden) ו-'pagehide' יורים גם כשהמשתמש עובר
   אפליקציה, נועל מסך, או שהמערכת סוגרת את הטאב/אפליקציה בלי אזהרה —
   אמינים בהרבה מ-beforeunload באנדרואיד. בשני המקרים מבצעים שמירה
   מיידית (בלי להמתין ל-debounce) של הטיוטה הפתוחה ושל הערות שלא נשמרו.
*/
function flushUnsavedWork() {
  clearTimeout(__draftSaveTimer);
  autosaveDraftNow();
  if (__dirtyNotesCaseId) {
    clearTimeout(__notesSaveTimer);
    autosaveNotesNow(__dirtyNotesCaseId);
  }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) flushUnsavedWork(); });
window.addEventListener('pagehide', flushUnsavedWork);


async function shareSelection(caseId, includePhotos, includeQuote) {
  const c = await dbGet('cases', caseId);
  const files = [];

  if (includePhotos) {
    const photos = await dbGetByIndex('photos', 'caseId', caseId);
    photos.filter(p => p.blob).forEach((p, i) => files.push(new File([p.blob], `photo_${i + 1}.${fileExtFor(p.blob)}`, { type: p.blob.type || 'image/jpeg' })));
  }
  if (includeQuote) {
    const quotes = await dbGetByIndex('quotes', 'caseId', caseId);
    quotes.filter(q => q.blob).forEach(q => files.push(new File([q.blob], q.name, { type: q.mime || q.blob.type || 'application/octet-stream' })));
  }
  if (files.length === 0) { toast('אין מה לשתף'); return; }

  if (navigator.canShare && navigator.canShare({ files })) {
    try {
      await navigator.share({ files, title: `רכב ${formatPlate(c.plateNormalized)}`, text: `${formatPlate(c.plateNormalized)} - ${c.garageName}` });
    } catch (e) { /* המשתמש ביטל את השיתוף */ }
  } else {
    toast('שיתוף קבצים לא נתמך בדפדפן הזה — נסה מכרום באנדרואיד');
  }
}

async function openQuote(quoteId) {
  const q = await dbGet('quotes', quoteId);
  if (q.blob) {
    window.open(URL.createObjectURL(q.blob), '_blank');
  } else if (q.driveFileId) {
    window.open(`https://drive.google.com/file/d/${q.driveFileId}/view`, '_blank');
  } else {
    toast('הקובץ לא זמין');
  }
}

async function screenGarages() {
  const garages = await dbGetAll('garages');
  return `
    <header class="top">
      <button class="icon-btn" onclick="nav('list')">↩ חזרה</button>
      <h1>ניהול מוסכים</h1>
      <span></span>
    </header>

    ${garages.map(g => `
      <div class="garage-row">
        <span>${escapeHtml(g.name)}</span>
        <div class="row" style="flex:none;gap:8px;">
          <button class="btn btn-secondary btn-sm" onclick="renameGarage('${g.garageId}')">עריכה</button>
          <button class="btn btn-danger btn-sm" onclick="deleteGarage('${g.garageId}')">מחיקה</button>
        </div>
      </div>
    `).join('')}

    <div class="card">
      <div class="row">
        <input type="text" id="newGarageName" placeholder="שם מוסך חדש">
        <button class="btn btn-primary" style="flex:0 0 auto;width:auto;padding:13px 20px" onclick="addGarage()">הוסף</button>
      </div>
    </div>
  `;
}

async function addGarage() {
  const input = document.getElementById('newGarageName');
  const name = input.value.trim();
  if (!name) return;
  await dbPut('garages', { garageId: uuid(), name, isActive: true });
  renderInPlace();
}
async function renameGarage(id) {
  const g = await dbGet('garages', id);
  const name = prompt('שם חדש למוסך:', g.name);
  if (name && name.trim()) { g.name = name.trim(); await dbPut('garages', g); renderInPlace(); }
}
async function deleteGarage(id) {
  if (!confirm('למחוק את המוסך? תיקים קיימים ישמרו את השם ההיסטורי שלהם.')) return;
  await dbDelete('garages', id);
  renderInPlace();
}

/* ====================== Utils ====================== */
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('he-IL') + ' ' + d.toLocaleTimeString('he-IL', {hour:'2-digit',minute:'2-digit'});
}
function uploadStatusLabel(status) {
  switch (status) {
    case 'uploaded': return '✅ הועלה';
    case 'uploading': return '⏳ מעלה...';
    case 'failed': return '⚠️ נכשל';
    default: return '⏸ ממתין';
  }
}
function isVideoBlob(blob) { return !!(blob && blob.type && blob.type.startsWith('video/')); }
function fileExtFor(blob) {
  const type = blob && blob.type;
  if (type === 'video/webm') return 'webm';
  if (type === 'video/mp4') return 'mp4';
  return 'jpg';
}

/* ====================== Render loop ====================== */
async function render() {
  // שומרים איזה שדה היה בפוקוס ומיקום הסמן בו, כדי לא לאבד את המקלדת
  // כשמריצים רינדור מלא באמצע הקלדה (למשל בחיפוש).
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

  const app = document.getElementById('app');
  if (route.screen === 'list') app.innerHTML = await screenList();
  else if (route.screen === 'new') app.innerHTML = await screenNew();
  else if (route.screen === 'detail') app.innerHTML = await screenDetail(route.caseId);
  else if (route.screen === 'garages') app.innerHTML = await screenGarages();
  afterRender();

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart != null && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}
async function renderInPlace() { await render(); }
function afterRender() {
  if (route.screen === 'list') bindListEvents();
  if (route.screen === 'new') bindNewCaseEvents();
  if (route.screen === 'detail') afterDetailRender(route.caseId);
}

updateConnectionBanner();
render();

</script>
